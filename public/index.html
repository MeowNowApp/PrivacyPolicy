<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowNow - Legal Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f7;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #1d1d1f;
        }

        p {
            color: #86868b;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .links a {
            display: block;
            padding: 20px 30px;
            background: #007aff;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 500;
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .links a:hover {
            background: #0051d5;
            transform: translateY(-2px);
        }

        .links a:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.2em;
            }

            .links a {
                font-size: 1em;
                padding: 16px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MeowNow</h1>
        <p>Legal Documents & Policies</p>

        <div class="links">
            <a href="privacy/">Privacy Policy</a>
            <a href="terms/">Terms & Conditions</a>
        </div>
    </div>
</body>
</html>
